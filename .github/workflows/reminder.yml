name: Attendance Reminder

# GitHub Actions evaluates cron in UTC.
# 09:30 UTC = 16:30 WIB (first reminder)
# 10:00-13:30 UTC = 17:00-20:30 WIB (every 30 minutes)
# 14:00 UTC = 21:00 WIB (final reminder)
# 1-5 = Monday to Friday
on:
  schedule:
    - cron: "30 9 * * 1-5"
    - cron: "0,30 10-13 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even outside the window or within the same 30-minute slot"
        type: boolean
        default: false
      dry_run:
        description: "Test without sending messages or changing state"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run attendance bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ILHAM_ID: ${{ secrets.ILHAM_ID }}
          NIA_ID: ${{ secrets.NIA_ID }}
          NIA_ID_2: ${{ secrets.NIA_ID_2 }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python attendance_bot.py
